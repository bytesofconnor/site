# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: flowconnor/site
  branch: main

site_url: https://flowconnor.dev
display_url: https://flowconnor.dev

media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: posts
    label: Blog
    label_singular: Post
    folder: posts
    create: true
    extension: md
    format: yaml-frontmatter
    slug: '{{slug}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, time_format: false }
      - { label: Summary, name: description, widget: text, required: false }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Body, name: body, widget: richtext }
